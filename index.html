*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden;
background:radial-gradient(900px 500px at 10% -10%,var(--glow1),transparent 60%),radial-gradient(700px 500px at 110% 10%,var(--glow2),transparent 60%),linear-gradient(var(--bg),var(--bg2));background-attachment:fixed;
transition:background-color .4s ease,color .4s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{max-width:480px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 .72rem "DM Sans",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.theme{display:inline-flex;padding:3px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.theme button{width:auto;padding:6px 12px;border-radius:99px;background:transparent;color:var(--mut);font:700 .8rem "DM Sans",sans-serif;box-shadow:none;transition:background .3s,color .3s}
.theme button[aria-pressed="true"]{background:var(--me);color:var(--on-me);outline:none}
main{max-width:480px;margin:0 auto;padding:14px 16px 48px}
main.enter>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(5){animation-delay:.16s}main.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,.big{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);margin:.35rem 0 1.3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(10px);transition:background .4s,border-color .4s}
label{display:block;font-weight:700;font-size:.82rem;letter-spacing:.02em;margin:0 0 7px;color:var(--mut)}
input{width:100%;font:inherit;padding:13px 15px;border-radius:14px;border:2px solid var(--line);background:var(--card-solid);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--me);box-shadow:0 0 0 4px var(--me-bg)}
input#cd{text-transform:uppercase;letter-spacing:.22em;font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}.row>input{flex:2}
button{font:700 1rem "DM Sans",sans-serif;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;background:linear-gradient(180deg,var(--me-2),var(--me));color:var(--on-me);width:100%;
box-shadow:0 6px 16px -6px var(--me);transition:transform .15s ease,box-shadow .2s ease,opacity .2s,background .3s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px) scale(.99)}
button.sec{background:var(--card-solid);color:var(--ink);border:2px solid var(--line);box-shadow:none}
button.fr{background:linear-gradient(180deg,var(--c0),var(--fr));color:#fff;box-shadow:0 6px 16px -6px var(--fr)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.seg button[aria-pressed="true"]{border-color:var(--me);background:var(--me-bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--fr);outline-offset:2px}
.gap>*+*{margin-top:10px}
.msg{color:var(--bad);font-weight:500;min-height:1.4em;margin:8px 0 0}
.note{color:var(--mut);font-size:.88rem}
.invite{background:var(--me-bg);border:1px solid var(--me);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:500}
.big{font-size:3rem;font-weight:800;letter-spacing:.16em;text-align:center;color:var(--me)}
.link{font-size:.82rem;word-break:break-all;color:var(--mut);text-align:center;user-select:all}
/* player colours: .me is always teal for the viewer, everyone else keeps their own colour */
.me{--pc:var(--me);--pcb:var(--me-bg)}
.p0{--pc:var(--c0);--pcb:var(--c0b)}.p1{--pc:var(--c1);--pcb:var(--c1b)}.p2{--pc:var(--c2);--pcb:var(--c2b)}.p3{--pc:var(--c3);--pcb:var(--c3b)}.p4{--pc:var(--c4);--pcb:var(--c4b)}
.p5{--pc:var(--c5);--pcb:var(--c5b)}.p6{--pc:var(--c6);--pcb:var(--c6b)}.p7{--pc:var(--c7);--pcb:var(--c7b)}.p8{--pc:var(--c8);--pcb:var(--c8b)}.p9{--pc:var(--c9);--pcb:var(--c9b)}
.slot{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);margin-top:8px;transition:background .3s,border-color .3s}
.slot[class*=" p"],.slot.me{border-color:var(--pc);background:var(--pcb)}
.slot b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc,var(--mut));flex:none;box-shadow:0 0 0 3px var(--pcb,transparent)}
.away{opacity:.5}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:12px}
.sc{border-radius:16px;padding:9px 11px;border:1.5px solid var(--pc);background:var(--pcb);min-width:0;transition:transform .3s}
.sc b{display:block;font:800 1.7rem "Bricolage Grotesque",sans-serif;line-height:1.05}
.sc span{display:block;font-size:.76rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc.bump{animation:bump .6s ease}@keyframes bump{30%{transform:scale(1.08)}}
.meta{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:7px;color:var(--mut)}

.box.on{border-style:solid;border-color:var(--me);background:var(--me-bg);cursor:pointer}
.box.on:hover{border-color:var(--bad)}

.box:disabled{opacity:1;cursor:default}

.over{background:var(--fr-bg);border:1px solid var(--fr);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:500}
.over button{margin-top:10px}

ol.rank{padding:0;margin:0;list-style:none}ol.rank li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}ol.rank li:last-child{border-bottom:0}
ol.rank li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.rank .pts{font:800 1.3rem "Bricolage Grotesque",sans-serif}
.tag{font-weight:700;color:var(--pc,var(--mut))}
.row2{display:flex;gap:8px;justify-content:center}.row2 button{width:auto;flex:1}

.intro{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:10px 0 30px}
.eyebrow{font:700 .78rem "DM Sans",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.title{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px}

.title .t{width:34px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);border:1px solid var(--tile-edge);box-shadow:0 3px 0 var(--tile-edge);font:800 1.3rem "Bricolage Grotesque",sans-serif;transition:transform .7s cubic-bezier(.3,1.4,.4,1)}

.gname{font:800 2.2rem "Bricolage Grotesque",sans-serif;color:var(--me);letter-spacing:-.01em;margin-bottom:18px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 22px}
.how div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;font-size:.84rem;font-weight:500;box-shadow:var(--shadow)}
.how b{display:block;font:800 1.2rem "Bricolage Grotesque",sans-serif;color:var(--me);margin-bottom:2px}
.fine{font-size:.8rem;color:var(--mut);margin-top:12px}

const ME=(()=>{const v=SS.get('sd_id');if(typeof v==='string'&&ID_RE.test(v))return v;const n=rid(10);SS.set('sd_id',n);return n})();

let lib=null,libState='loading',net=null,netUp=false;
let solo=false,isHost=false,S=null,screen='intro',myName=(typeof LS.get('sd_name')==='string'?LS.get('sd_name'):''),code='',homeMsg='';

function clean(s){return typeof s==='string'?s.replace(/[\u0000-\u001f\u007f<>&"]/g,'').trim().slice(0,14):''}

 app.replaceChildren(...n.filter(x=>x!=null&&x!==false));

}

const SEEN_KEY='sd_seen';
function seenMap(){const m=LS.get(SEEN_KEY);return m&&typeof m==='object'&&!Array.isArray(m)?m:{}}
function markSeen(idxs){const m=seenMap(),now=Date.now();let ch=false;for(const i of idxs){const b=BANK[i];if(b&&!m[b.w]){m[b.w]=now;ch=true}}if(ch)LS.set(SEEN_KEY,m)}
function mySeenIdx(){const m=seenMap(),out=[];BANK.forEach((b,i)=>{if(m[b.w])out.push(i)});return out}
let peerSeen={};
/* pick words nobody in the room has seen; if everyone has seen everything, use the ones seen longest ago */
function buildDeck(total){
 const cnt=new Array(N).fill(0);const add=a=>{for(const i of a)if(Number.isInteger(i)&&i>=0&&i<N)cnt[i]++};
 add(mySeenIdx());
 if(S&&!solo)for(const p of S.players)if(p.id!==ME&&p.on&&peerSeen[p.id])add(peerSeen[p.id]);
 const m=seenMap();
 return [...Array(N).keys()].map(i=>[i,cnt[i],m[BANK[i].w]||0,Math.random()]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]||a[3]-b[3]).slice(0,total).map(x=>x[0]);
}
/* every player gets their own letter order: distinct permutations from the round seed, picked by colour slot */
function scrFor(word,slot){
 const r=rng(hash(S.seed+':'+S.round));const seen=new Set([word]);const list=[];let t=0;
 while(list.length<=slot&&t<500){t++;const a=shuf(word.split(''),r).join('');if(!seen.has(a)){seen.add(a);list.push(a)}}
 return (list[slot]||list[list.length-1]||word.split('').reverse().join('')).split('');
}

 s.onload=()=>{if(window.mqtt&&typeof mqtt.connect==='function'){lib=mqtt;libState='ok';refreshHome();afterLib()}else loadLib(i+1)};

}
function netOpen(c,will){
 const T=APP+'/'+c;
 const n={T,clients:[],seen:new Set(),q:[],closed:false};
 n.mark=i=>{n.seen.add(i);n.q.push(i);if(n.q.length>800)n.seen.delete(n.q.shift())};
 n.pub=(sub,t,d,retain)=>{const env={i:rid(10),f:ME,t,d};n.mark(env.i);const s=JSON.stringify(env);for(const cl of n.clients)if(cl.connected){try{cl.publish(T+'/'+sub,s,{qos:0,retain:!!retain})}catch(e){}}};
 n.clearState=()=>{for(const cl of n.clients)if(cl.connected){try{cl.publish(T+'/s','',{qos:0,retain:true})}catch(e){}}};
 net=n;netUp=false;
 return new Promise(res=>{
  let done=false;const fin=v=>{if(!done){done=true;res(v)}};
  setTimeout(()=>fin(n.clients.some(x=>x.connected)?n:null),12000);
  for(const url of BROKERS){
   let cl;
   try{cl=lib.connect(url,{clientId:'sd_'+ME+'_'+rid(4),clean:true,keepalive:20,reconnectPeriod:3000,connectTimeout:10000,will})}catch(e){continue}
   n.clients.push(cl);
   cl.on('connect',()=>{if(n.closed){cl.end(true);return}cl.subscribe([T+'/s',T+'/u',T+'/d'],{qos:0},()=>{});netStatus();if(net===n&&done)onReconnect();fin(n)});
   cl.on('message',(topic,buf)=>onRaw(n,topic,buf));
   cl.on('close',()=>netStatus());
   cl.on('offline',()=>netStatus());
   cl.on('error',()=>{});
  }
 });
}
function netClose(n,graceful){if(!n)return;n.closed=true;for(const cl of n.clients){try{cl.end(!graceful)}catch(e){}}}
function netStatus(){
 const up=!!(net&&net.clients.some(x=>x.connected));

function onRaw(n,topic,buf){
 if(n!==net||n.closed)return;
 const sub=topic.slice(n.T.length+1);
 let txt;try{txt=typeof buf==='string'?buf:buf.toString()}catch(e){return}
 if(!txt||txt.length>30000)return;
 let env;try{env=JSON.parse(txt)}catch(e){return}
 if(!env||typeof env!=='object'||typeof env.t!=='string'||typeof env.f!=='string'||!ID_RE.test(env.f))return;

/* ---------- referee (host) ---------- */
function snapshot(){
 const now=Date.now();
 S.left=S.phase==='play'?(S.paused?pausedLeft:Math.max(0,endsAt-now)):(S.phase==='result'?(S.paused?pausedLeft:Math.max(0,endsAt-now)):0);
 S.left=Math.min(S.left,ROUND_MS);
}
function bcast(silent){
 if(!S)return;
 S.seq++;snapshot();
 if(net&&!solo){net.pub('s','state',S,true);lastPub=Date.now();SS.set('sd_host',{code,S,t:Date.now()})}
 if(!silent)render();
}
function arm(ms,fn){clearTimeout(gt);endsAt=Date.now()+ms;gt=setTimeout(fn,ms)}
function startRound(){S.phase='play';S.result=null;S.rs++;arm(ROUND_MS,()=>finish('n'));deadline=endsAt;bcast()}
function finish(who){
 if(!S||S.phase!=='play'||S.paused)return;
 S.phase='result';S.result=who;const p=pById(who);if(p)p.score++;
 S.log.push([wordIdx(S.round),who]);arm(RESULT_MS,next);bcast();
}
function next(){if(!S)return;if(S.round+1>=S.total){S.phase='final';clearTimeout(gt);bcast()}else{S.round++;startRound()}}
function startGame(again){
 if(again)S.off++;
 S.players=S.players.filter(p=>p.on);S.players.forEach(p=>p.score=0);
 S.seed=rid(8);S.deck=buildDeck(S.total);
 S.round=0;S.log=[];S.paused=false;startRound();
}
function pause(){if(S.paused)return;pausedLeft=Math.max(0,endsAt-Date.now());S.paused=true;clearTimeout(gt)}
function resume(){
 if(!S.paused)return;S.paused=false;
 if(S.phase==='play'){arm(Math.max(pausedLeft,10000),()=>finish('n'));deadline=endsAt}

}
function checkPause(){

}
function freeSlot(){const used=new Set(S.players.map(p=>p.c));for(let i=0;i<MAXP;i++)if(!used.has(i))return i;return 0}

function onUp(env){

 if(env.t==='hello'){
  const name=clean(d.name)||'Friend';
  if(Array.isArray(d.seen))peerSeen[id]=d.seen.slice(0,N).filter(i=>Number.isInteger(i)&&i>=0&&i<N);
  if(p){p.name=name;p.on=true;lastSeen[id]=now}
  else{
   if(S.players.length>=MAXP){net.pub('d','full',{to:id});return}
   p={id,name,score:0,on:true,c:freeSlot()};S.players.push(p);lastSeen[id]=now;
  }
  checkPause();bcast();return;
 }
 if(!p)return;
 if(env.t==='bye'){dropPlayer(p);return}
 lastSeen[id]=now;
 if(!p.on){p.on=true;checkPause();bcast()}

}
function hostLoop(){
 if(!S||!isHost||solo)return;
 const now=Date.now();let changed=false;
 for(const p of S.players.slice()){
  if(p.id===ME||!p.on)continue;
  if(!lastSeen[p.id])lastSeen[p.id]=now;
  if(now-lastSeen[p.id]>12000){if(S.phase==='lobby')S.players=S.players.filter(x=>x!==p);else p.on=false;changed=true}
 }
 if(changed){checkPause();bcast()}
 else if(now-lastPub>3000)bcast(true);
}

/* ---------- player (non-host) ---------- */
function sendHello(){if(net)net.pub('u','hello',{name:myName,seen:mySeenIdx()})}
function okState(d){
 if(!d||typeof d!=='object')return null;
 const I=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
 if(d.v!==3||d.code!==code||typeof d.host!=='string'||!ID_RE.test(d.host))return null;
 if(typeof d.seed!=='string'||!/^[a-z0-9]{1,12}$/.test(d.seed))return null;
 if(!Array.isArray(d.deck)||d.deck.length>20||(d.phase!=='lobby'&&d.deck.length!==d.total)||!d.deck.every(i=>I(i,0,N-1))||new Set(d.deck).size!==d.deck.length)return null;
 if(!I(d.off,0,100000)||![10,15,20].includes(d.total)||!I(d.round,0,d.total-1)||!I(d.rs,0,1e6)||!I(d.seq,0,1e9)||!I(d.left,0,ROUND_MS)||!['lobby','play','result','final'].includes(d.phase))return null;
 if(!Array.isArray(d.players)||d.players.length<1||d.players.length>MAXP)return null;
 const players=[],ids=new Set();
 for(const p of d.players){
  if(!p||typeof p!=='object'||typeof p.id!=='string'||!ID_RE.test(p.id)||ids.has(p.id)||!I(p.score,0,20)||!I(p.c,0,MAXP-1))return null;
  ids.add(p.id);players.push({id:p.id,name:clean(p.name)||'Player',score:p.score,on:p.on===true,c:p.c});
 }
 if(!Array.isArray(d.log)||d.log.length>20)return null;
 const log=[];for(const e of d.log){if(!Array.isArray(e)||!I(e[0],0,N-1)||typeof e[1]!=='string'||!(e[1]==='n'||ids.has(e[1])||ID_RE.test(e[1])))return null;log.push([e[0],e[1]])}
 const result=d.result==='n'||(typeof d.result==='string'&&ID_RE.test(d.result))?d.result:null;
 return{v:3,code:d.code,host:d.host,seed:d.seed,off:d.off,deck:d.deck.slice(),total:d.total,round:d.round,rs:d.rs,seq:d.seq,left:d.left,phase:d.phase,paused:d.paused===true,players,result,log};

function onState(env){

 }

 S=s;
 if(s.phase==='play'&&!s.paused){

function onDown(env){

function unpick(i){
 if(blocked()||i<0||i>=picks.length)return;
 picks.splice(i,1);fb='';fbc='';upd();
}
function buildFinal(){
 const ranked=S.players.slice().sort((a,b)=>b.score-a.score);
 const top=ranked.length?ranked[0].score:0,leaders=ranked.filter(p=>p.score===top);
 let title;
 if(solo)title='You solved '+(meP()?meP().score:0)+' of '+S.total;
 else if(top===0)title='Nobody scored this time';
 else if(leaders.length>1)title=leaders.some(p=>p.id===ME)?'You tied for first!':'It’s a draw';
 else title=leaders[0].id===ME?'You win!':leaders[0].name+' wins';
 const rank=solo?null:h('div',{class:'card'},h('label',null,'Final scores'),h('ol',{class:'rank'},ranked.map((p,i)=>h('li',{class:cls(p)},h('span',{class:'dot'}),h('b',null,(i+1)+'. '+p.name+(p.id===ME?' (you)':'')),h('span',{class:'pts'},String(p.score))))));
 const rec=S.log.map(([i,w])=>{const p=pById(w);const who=w==='n'?'Nobody':w===ME?'You':(p?p.name:'Someone');return h('li',null,h('span',null,BANK[i].w.toLowerCase()),h('span',{class:'tag '+(w==='n'?'':cls(p))},who))});
 show(overlay(),h('div',{class:'card banner'},h('h2',null,title),h('p',{class:'note'},solo?'Nice practice run.':S.total+' words played.')),
  rank,
  h('div',{class:'card'},h('label',null,'Recap'),h('ul',{class:'rec'},rec)),
  isHost?h('button',{disabled:!solo&&onlineCount()<2,onclick:()=>startGame(true)},'Play again (new words)'):h('p',{class:'note'},'Waiting for the host to start another game.'));
}
function render(){
 viewKey=screen+(S?':'+S.phase+':'+S.round+':'+S.rs:'');
 if(screen==='intro'){buildIntro();return}
 if(screen==='home'){buildHome();return}
 if(!S||!meP()){show(h('h2',null,'Joining…'),h('p',{class:'sub'},'Looking for game '+code+'.'),statusLine(),h('button',{class:'sec',onclick:()=>leave()},'Cancel'));return}
 if(S.phase==='lobby')buildLobby();else if(S.phase==='final')buildFinal();else buildPlay();
}
function tick(){
 const b=document.getElementById('bar'),s=document.getElementById('secs');
 if(!b||!S)return;
 if(S.phase!=='play'){b.style.width='0';if(s)s.textContent='';return}
 let left;
 if(!solo&&(S.paused||hostGone))left=isHost?pausedLeft:S.left;
 else left=Math.max(0,(isHost?endsAt:deadline)-Date.now());
 b.style.width=(left/ROUND_MS*100)+'%';if(s)s.textContent=Math.ceil(left/1000)+'s';
 const bw=b.parentNode;if(bw){bw.classList.toggle('mid',left<=15000&&left>7000);bw.classList.toggle('low',left<=7000)}
}
setInterval(tick,200);
setInterval(()=>{if(isHost)hostLoop();else playerLoop();netStatus()},1000);
document.addEventListener('keydown',e=>{
 if(screen!=='game'||!S||S.phase!=='play'||blocked()||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target&&e.target.matches&&e.target.matches('input'))return;
 if(e.key==='Backspace'){e.preventDefault();picks.pop();fb='';fbc='';upd();return}
 if(/^[a-zA-Z]$/.test(e.key)){const L=e.key.toUpperCase();const i=tiles.findIndex((t,k)=>t===L&&!picks.includes(k));if(i>=0)pick(i)}
});
window.addEventListener('pagehide',()=>{if(net&&!solo&&!isHost)try{net.pub('u','bye',{})}catch(e){}});

/* resume after a refresh: host keeps the game, players keep their seat and score */
function afterLib(){
 const sh=SS.get('sd_host');
 if(sh&&sh.S&&Date.now()-sh.t<30*60000){
  code=sh.code;const s=okState(sh.S);
  if(s&&s.host===ME){
   S=s;isHost=true;solo=false;screen='game';lastSeen={};
   const now=Date.now();S.players.forEach(p=>{if(p.id!==ME)lastSeen[p.id]=now});
   if(S.phase==='play'||S.phase==='result'){
    // restart the clock from where it was
    if(S.phase==='play'){arm(Math.max(S.left,10000),()=>finish('n'));deadline=endsAt}else arm(RESULT_MS,next);
    if(S.paused){S.paused=false;pause()}
   }
   render();
   netOpen(code,{topic:APP+'/'+code+'/s',payload:'',qos:0,retain:true}).then(n=>{if(net===n&&n){netStatus();checkPause();bcast()}});
   return;
  }
 }
 const sj=SS.get('sd_join');
 if(sj&&typeof sj.code==='string'&&/^[A-Z0-9]{5}$/.test(sj.code)){myName=clean(sj.name)||myName||'Player';joinGame(sj.code)}
}
buildTop();
render();
loadLib(0);
})();
</script>
